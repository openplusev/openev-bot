services:
  openev-bot:
    container_name: openev-bot
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    volumes:
      - bot-data:/app/data
    networks:
      - proxy

networks:
  proxy:
    external: true

volumes:
  bot-data:
    name: opencapper-bot_opencapper-bot-data
