services:
  openev-bot:
    container_name: openev-bot
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    environment:
      # openev-api joins the proxy network; REST and the live feed (ws://openev-api:8080/v1/ws) skip Traefik.
      - OPENEV_API_URL=http://openev-api:8080
    volumes:
      - bot-data:/app/data
    networks:
      - proxy

networks:
  proxy:
    external: true

volumes:
  bot-data:
    name: opencapper-bot_opencapper-bot-data
